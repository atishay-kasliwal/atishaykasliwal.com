<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Page not found. Return to Atishay Kasliwal's portfolio." />
    <meta name="theme-color" content="#111111" />
    <title>404 · Page not found — Atishay Kasliwal</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      @font-face {
        font-family: "Geist Variable";
        src: url("/assets/geist-latin-wght-normal-BgDaEnEv.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: "Geist Mono Variable";
        src: url("/assets/geist-mono-latin-wght-normal-XN7g48iV.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        --sans: "Geist Variable", "Helvetica Neue", Arial, sans-serif;
        --mono: "Geist Mono Variable", ui-monospace, Menlo, monospace;
        --ink: #efefec;
        --muted: #848480;
        --accent: #8554ff;
        --line: #3a3a36;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      html { font-variant-emoji: text; }
      body {
        min-height: 100svh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #111;
        color: var(--ink);
        font: 16px/1.5 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      main { width: min(100%, 720px); padding: 32px; }
      .code {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        color: var(--muted);
        font: 400 10.5px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .code::before {
        content: "";
        width: 6px;
        height: 6px;
        flex: 0 0 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .code span { color: #565650; }
      h1 {
        max-width: 12ch;
        margin: 24px 0 28px;
        font-size: 56px;
        font-weight: 450;
        line-height: 1.05;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }
      h1 span { color: #969692; }
      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 24px;
        padding: 0 0 5px;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        font: 400 12px/1.4 var(--mono);
        text-decoration: none;
        transition: border-color 0.2s, color 0.2s;
      }
      .home-link:hover { border-color: var(--accent); color: #fff; }
      .home-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 5px;
      }
      .home-link b { color: var(--accent); font-weight: 400; }
      @media (max-width: 600px) {
        body { padding: 20px; }
        main { padding: 18px 4px; }
        h1 { max-width: 10ch; margin: 20px 0 24px; font-size: 42px; }
      }
      @media (max-height: 480px) {
        main { padding-block: 16px; }
        h1 { margin-block: 14px 18px; font-size: 38px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 <span>/</span> Not found</p>
      <h1>Page not found<span>.</span></h1>
      <a class="home-link" href="/">Back home <b aria-hidden="true">↗︎</b></a>
    </main>
  </body>
</html>
