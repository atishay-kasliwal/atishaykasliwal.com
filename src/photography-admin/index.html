<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#111111" />
  <title>Photography admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/photography-admin/admin.css" />
</head>
<body>
  <main class="admin" id="admin">
    <header class="admin-head">
      <p class="admin-title"><i aria-hidden="true"></i>Photography / Admin</p>
      <p class="admin-count" id="admin-count" aria-live="polite"></p>
    </header>

    <section class="drop" id="drop" aria-label="Upload photographs">
      <p class="drop-title">Drop photographs here</p>
      <p class="drop-sub">or <button type="button" id="choose">choose files</button>. Originals are kept private; uploads start immediately.</p>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
    </section>

    <p class="notice" id="notice" role="status" aria-live="polite" hidden></p>

    <section class="queue" id="queue-section" aria-label="Uploads" hidden>
      <h2 class="label">Uploads</h2>
      <ul class="rows" id="queue"></ul>
    </section>

    <section class="library" aria-labelledby="library-title">
      <div class="library-head">
        <h2 class="label" id="library-title">Library</h2>
        <div class="filters" role="group" aria-label="Filter">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="visible" aria-pressed="false">Visible</button>
          <button type="button" data-filter="hidden" aria-pressed="false">Hidden</button>
        </div>
      </div>
      <ul class="rows" id="library"></ul>
      <p class="empty" id="empty" hidden>Nothing here yet.</p>
    </section>
  </main>
  <script type="module" src="/src/photography-admin/admin.js"></script>
</body>
</html>
