<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#111111" />
  <title>Résumé admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/photography-admin/admin.css" />
  <link rel="stylesheet" href="/src/admin/admin.css" />
</head>
<body>
  <main class="admin rz" id="admin">
    <header class="admin-head rz-head">
      <p class="admin-title"><i aria-hidden="true"></i>Admin / Résumé</p>
      <div id="nav"></div>
    </header>

    <!-- What the public URL serves right now. -->
    <section class="rz-strip" id="published" aria-label="Live résumé"><p class="muted">Loading…</p></section>
    <p class="notice rz-notice" id="notice" role="status" aria-live="polite" hidden></p>

    <div class="rz-grid">
      <aside class="rz-side" aria-label="Versions">
        <div class="drop rz-drop" id="drop">
          <p class="drop-title">Drop a PDF</p>
          <p class="drop-sub">or <button type="button" id="choose">choose a file</button> · up to <span id="limit">5 MB</span>. Nothing goes live until you publish.</p>
          <input id="file" type="file" accept="application/pdf,.pdf" hidden />
        </div>
        <h2 class="label rz-side-label">Versions</h2>
        <ul class="rz-list" id="versions"></ul>
        <details class="rz-history">
          <summary class="label">Activity <span class="rz-count" id="history-count"></span></summary>
          <ol class="rz-log" id="history"></ol>
        </details>
      </aside>

      <section class="rz-work" id="review" aria-live="polite"></section>
    </div>
  </main>
  <script type="module" src="/src/admin/resume/resume.js"></script>
</body>
</html>
