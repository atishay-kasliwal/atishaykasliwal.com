name: Live SEO crawl

on:
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:

jobs:
  crawl:
    name: Sitemap health and technical crawl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check sitemap URL health
        run: npm run seo:sitemap:live

      - name: Crawl live pages
        run: npm run seo:crawl:live

      - name: Save crawl reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-crawl
          path: artifacts/seo-*.json
          if-no-files-found: ignore