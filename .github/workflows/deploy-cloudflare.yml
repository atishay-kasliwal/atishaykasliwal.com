name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  # Daily redeploy so the homepage's prerendered GitHub snapshot stays recent. The live panel
  # comes from functions/api/github-activity.js; GitHub often skips scheduled runs, so they
  # can't be relied on for freshness.
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keeps the committed snapshot if GitHub's API is unavailable, so a deploy never fails on it.
      - name: Refresh GitHub activity
        run: npm run github:activity || echo "Using the committed GitHub activity snapshot."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy ./dist --project-name=atishay-kasliwal-github-io --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
