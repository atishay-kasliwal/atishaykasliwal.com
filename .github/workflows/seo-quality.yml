name: SEO and Lighthouse checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Build, SEO validation, Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate SEO
        run: npm test

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun